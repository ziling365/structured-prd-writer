display_name: 结构化 PRD 写作规范
short_description: 按标准 PRD 模板生成 Word 版需求文档，严格处理目录、空模块、版本记录、限制项和研发详细设计
default_prompt: Use $structured-prd-writer to turn source requirements, BRD/SOW notes, or existing PRDs into a strict structured PRD. Generate a Word .docx by default, or Markdown only when explicitly requested. Keep all required sections, use 无 or 未提供 for empty content, never 暂无, keep 产品功能详细设计 aligned with 功能详情, and end with ---文档以下无内容---.
