display_name: 结构化 PRD 写作规范
short_description: 按 结构化 PRD 模板写出完整、可审的 PRD，严格处理空模块、版本记录、限制项和 Mermaid 流程图
default_prompt: Use $structured-prd-writer to turn source requirements, BRD/SOW notes, or existing PRDs into a strict structured PRD with complete sections, faithful overview text, explicit revisions, business limits, unsupported items, and Mermaid-only system/process flowcharts. Preserve empty sections with 无 or 未提供, never 暂无.
